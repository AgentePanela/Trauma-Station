- type: entity
  parent: [ LockerBase, AntiTamperLowPriority ]
  id: LockerArmorer
  name: armorer locker
  components:
  - type: Appearance
  - type: EntityStorageVisuals
    stateBaseClosed: armorer
    stateDoorOpen: armorer_open
    stateDoorClosed: armorer_door
  - type: AccessReader
    access: [["Armory"]]
  - type: Sprite
    sprite: _Trauma/Structures/Storage/closet.rsi
    layers:
    - state: armorer
      map: ["enum.StorageVisualLayers.Base"]
    - state: armorer_door
      map: ["enum.StorageVisualLayers.Door"]
    - state: locked
      map: ["enum.LockVisualLayers.Lock"]
      shader: unshaded
    - state: welded
      visible: false
      map: ["enum.WeldableLayers.BaseWelded"]
    - state: paper
      visible: false
      sprite: Structures/Storage/closet_labels.rsi
      offset: "-0.065,0"
      map: ["enum.PaperLabelVisuals.Layer"]
